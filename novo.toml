[package]
name        = "ros2-nv"
version     = "0.1.7"
description = "The rclc node model for novo-lang: rcl's return codes, the name rules a node is refused for, QoS compatibility answered before an endpoint is created rather than discovered as silence, a fixed handle table with no allocator behind it, the executor as a step a caller drives, and the Micro XRCE-DDS session that carries it all to a micro-ROS agent over TCP or UDP or, on a device, over a UART, with samples longer than one message joined from the pieces the agent sends them in and cut into pieces to send, and services: a requester that calls and a replier that answers, in both, a request or a reply longer than one message included."
license     = "Apache-2.0"

stability   = "experimental"

# `core`, with one host module named below, and the plan's row for this
# package says `host`.
#
# The subject is rclc, which is the ROS 2 client library for a
# microcontroller, so the microcontroller is the half that decides the
# layer.  The return codes, the name rules, the QoS arithmetic, the
# handle table and the executor's step machine are integer arithmetic
# over values a caller already holds, and they run on a part with
# sixty-four kilobytes of RAM.  The session is written over
# `RosTransport[e]` and declares `[e]`, the effect the implementation
# behind the byte pipe supplies (SPEC § 5.6) — `[hw]` for a UART on a
# device, `[net]` for a socket on a host, nothing for a recorded
# exchange in a test.
#
# `tests/embedded_probe.nv` is what makes the claim a thing the audit
# BUILDS: `rosret`, `rosqos`, `rosgraph`, `rosexec` and the serial session
# (`xrceframe`, `xrcewire`, `xrcestream`, `xrcefrag`, `rosuart`, `roslink`) link for
# `--target=nrf52-qemu`.
layer       = "core"

# `rosagent` is the one module that performs: a Micro XRCE-DDS session
# over a TCP stream or a UDP socket to a micro-ROS agent, through
# `std.net`'s byte pair and its datagram calls.
# `[net]`, and nothing else — no clock, because every timeout in this
# package is a number the caller measures.
#
# `rosbridge` is the program between a radio link and an agent: it is
# written over `XrceUart[e]` and `RosTransport[f]` and so performs what
# the two it is given perform, and it builds `Bytes`, which a device
# does not.  It is named here for the second reason.
#
# `rosuart` and `roslink` are not named here, though they also perform: their functions are its functions are
# generic over `XrceUart[e]` and `LinkRadio[e]`, so they charge a caller what
# the caller's UART or radio costs, and the one UART in the package, over
# `hal.uart`, is `[hw]`, which a device builds.
host_modules = ["rosagent", "rosbridge"]

category    = "embedded"

tags        = ["ros2", "ros", "rclc", "micro-ros", "robotics", "xrce-dds",
               "dds", "qos", "embedded", "no-alloc", "serial", "uart", "udp", "tcp",
               "bluetooth", "ble", "radio"]
repository  = "https://github.com/novolang/ros2-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.26.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "Two endpoints that never connect, and the function that says so first"
"docs/agent-run.md" = "Running a node against a micro-ROS agent, and what each failure looks like"

[dependencies]
# NONE, and the absence that matters is a serialiser.
#
# A ROS 2 message on the wire is Common Data Representation, and this
# package carries a payload as bytes it does not read.  CDR is its own
# subject — the alignment rules, the encapsulation header, the byte
# order flag, the sequence and string encodings — and the ROS 2 plan
# already names `cdr-nv` as the package that owns it.  A copy of it here
# would be a second original, and a bag reader and a node would then
# disagree about a padding byte.
#
# `rosmsg` is the seam: it holds the bytes, the encapsulation header
# that says which byte order they are in, and the type identity, and it
# reads none of the payload.
